# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.sap.zficvageing
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://vhafbmedap01.hec.erp.alimco.in:443/
          client: '120'
          auth: basic
        credentials:
          username: env:med_user
          password: env:med_pass
        app:
          name: ZFI_CV_AGEING
          description: CV Ageing Dashboard
          package: ZFI
          transport: MEDK912844
        exclude:
          - /test/
