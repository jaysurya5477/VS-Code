#YMSG
noDataQuality=No quality dispositions for the current selection
#YMSG
noDataVendor=No vendors for the current selection
#YMSG
noDataPlant=No plants for the current selection
#YMSG
noDataMaterial=No materials for the current selection
#YMSG
noDataMatRej=No rejections for the current selection
#YMSG
noDataDocType=No PO document types for the current selection
#YMSG
noDataScorecard=No vendors for the current selection

#YMSG: Both dates are mandatory - the OData parameters have no default
errorDateRangeRequired=Select a GRN date range before loading the dashboard.
#YMSG: {0} = entity set name, {1} = message from the backend
errorLoadFailed=Could not load the dashboard ({0}): {1}
