# This is the resource bundle for com.sap.zsdpmsdash

#Texts for manifest.json

#XTIT: Application name
appTitle=Plant & Material Wise Sales Dashboard

#YDES: Application description
appDescription=Plant & Material Wise Sales Dashboard - Sales & Distribution billing analytics by plant, material, scheme and geography

# ---------------------------------------------------------------- header ----
#XTIT: Main view title
title=Plant & Material Wise Sales Dashboard
#XFLD: Module chip next to the title
headBadge=SD · Billing
#XFLD: Header subtitle
headSub=Material × Plant × Region · source ZSD_SALE_ALL · net, GST & gross by billing document
#XFLD: Label of the line that echoes the current selection
scopeLabel=SCOPE
#XFLD: Timestamp of the last successful load. {0} = local time
lastRefreshed=Refreshed {0}
#XBUT: Appearance switch
themeAuto=Auto
themeLight=Light
themeDark=Dark

# ---------------------------------------------------------------- filters ----
#XBUT: Run the query with the current filters
go=Go
#XBUT: Clear all filters back to their defaults
reset=Reset
#XFLD: Fiscal year filter
filterFy=Fiscal Year
#XFLD: Zone filter
filterZone=Zone
#XFLD: State filter
filterState=State
#XFLD: Plant filter
filterPlant=Plant
#XFLD: Scheme filter
filterScheme=Scheme
#XFLD: Material filter
filterMaterial=Material
#XFLD: Old material number, shown next to a material's code in the Material filter. {0} = old number
filterOldNumber=Old {0}
#XFLD: FY-period (month) filter
filterPeriod=Period
#XFLD: Placeholder shown when a code filter is empty
filterAllPlaceholder=All
#YMSG: Explains how the code filters behave
filterHint=Zone, State, Plant, Scheme, Material and Period accept any number of values, with a Select all option in each list. Leave a filter empty to include everything. Changes apply as soon as you close the list. The State/Plant/Scheme/Material lists are built from the codes the dashboard has returned so far, so they grow as you widen the selection. Material can also be searched by its old material number.

# ------------------------------------------------------------------- KPIs ----
#YMSG: Yesterday/Month-End Sale card context line. {0} = date, {1} = invoice count
kpiDailyNote={0} · {1} invoices
#YMSG: Yesterday/Month-End Sale card when the reference date hasn't happened yet
kpiDailyNoteEmpty=no billing
#XFLD: Tax card context line. {0} = effective GST rate
kpiAvgGst={0} avg rate
#XFLD: Shown instead of a percentage when there is no prior-year figure to compare against
deltaNew=new
#XFLD: Short fiscal-year label. {0} = year
fyShort=FY {0}

# ------------------------------------------------------------------ scope ----
#XFLD: Shown in the scope line when a filter is empty
allZones=All zones
allStates=All states
allPlants=All plants
allSchemes=All schemes
allMaterials=All materials

# ----------------------------------------------------------------- charts ----
#XTIT
mapTitle=Sales across India
#YMSG: Map hint, state granularity. {0} = states billed, {1} = states on the map
mapHintState={0} of {1} states billed · click a state to filter
#YMSG: Map hint, zone granularity. {0} = states billed, {1} = states on the map
mapHintZone={0} of {1} states billed · click a zone to filter
#XFLD: Choropleth granularity toggle
granularityState=State
granularityZone=Zone
#XFLD: Unit-dot overlay switch label - static text, the switch itself shows on/off
unitDotsLabel=Unit dots

#XFLD: Caption in front of the map's colour scale
mapScaleCap=Net value
#XFLD: Label under the palest step of the colour scale
mapLowest=lowest
#XFLD: Colour scale ends, used when there are too few values to label every break
mapLow=low
mapHigh=high
#XFLD: Colour scale swatch for states with no billing at all
mapNoBilling=no billing
#XFLD: Map dot legend
mapDotKey=dot size = unit net value
#XFLD: Map hover card rows
mapNetBilled=Net billed
mapGrowth=Growth
mapShare=Share of India
mapPlantsBilling=Plants billing
mapInvoices=Invoices
#XFLD: Map hover card eyebrow for a zone. Preceded by the number of states
mapZoneStates=states
#XFLD: Map hover card eyebrow for a unit dot. Preceded by the number of plants
mapUnitPlants=plants

#XTIT
chartSchemeTitle=Scheme performance
#XFLD: Scheme panel subtitle. {0} = prior fiscal year
schemeVsFy=Net value by scheme · vs FY {0}
#XFLD: Eyebrow above the top-states roll-up in the scheme panel
schemeTopStates=Top states
#XFLD: Trailing half of the scheme share sentence
schemeShareOfIndia=of India
#XFLD: Noun after the invoice count on a scheme row
schemeInvoices=invoices

#XTIT
chartPlantTitle=Sales by plant
#XFLD
chartPlantSub=Net + tax, stacked, ranked by net value
#XFLD
badgeTop20=TOP 20

#XTIT
chartMaterialTitle=Sales by material
#XFLD
chartMaterialSub=Net material value, ranked

# ---------------------------------------------------- empty and error states ----
#YMSG: Generic empty state
noData=No data for the current selection
#YMSG
noDataScheme=No schemes for the current selection
#YMSG
noDataStates=No billing in range. Clear a filter to see states again.
#YMSG
noDataPlant=No plants for the current selection
#YMSG
noDataMaterial=No materials for the current selection

#YMSG: {0} = entity set name, {1} = message from the backend
errorLoadFailed=Could not load the dashboard ({0}): {1}
#YMSG: {0} = underlying error message
errorEchartsFailed=Could not initialise the charting library: {0}
#YMSG
errorNoODataModel=The OData model is not configured. Check the mainService data source in manifest.json.
