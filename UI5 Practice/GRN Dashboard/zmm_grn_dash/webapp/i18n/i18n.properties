# This is the resource bundle for com.sap.zmmgrndash

#Texts for manifest.json

#XTIT: Application name
appTitle=GRN Dashboard

#YDES: Application description
appDescription=Goods Receipt (GRN) analysis dashboard - MM Materials Management

#XTIT: Main view title
title=Goods Receipt (GRN) Analysis
#XFLD: Module chip next to the title
headBadge=MM \u00b7 Materials Management

# ---------------------------------------------------------------- header ----
#XFLD: Label of the line that echoes the current selection
scopeLabel=SCOPE
#XFLD: Timestamp of the last successful load. {0} = local time
lastRefreshed=Refreshed {0}
#XBUT: Appearance switch
themeAuto=Auto
themeLight=Light
themeDark=Dark

# ---------------------------------------------------------------- filters ----
#XBUT: Run the query with the current filters
go=Go
#XBUT: Clear all filters back to their defaults
reset=Reset
#XFLD: Quick date-range preset
filterPeriod=Period
#XFLD: GRN posting date range
filterDateRange=GRN Date
#XFLD: Vendor filter
filterVendor=Vendor
#XFLD: Material filter
filterMaterial=Material
#XFLD: Plant filter
filterPlant=Plant
#XFLD: Purchasing document type filter
filterDocType=PO Doc. Type
#XFLD: Quantity UoM picker - scopes every chart panel to one base UoM; the hero
#XFLD: KPI and qualification cards are the exception and always show every UoM
filterUom=Quantity UoM
#XFLD: Placeholder shown when a code filter is empty
filterAllPlaceholder=All
#YMSG: Explains how the four code filters behave
filterHint=Plant, Vendor, PO Doc. Type and Material accept any number of values. Leave a filter empty to include everything. Changes apply when you click Go. The lists are built from the codes the dashboard has returned so far, so they grow as you widen the date range.

#XFLD: Period presets
periodCurrFy=Current FY (to date)
periodPrevFy=Previous FY
periodLast12=Last 12 months
periodYtd=Calendar year to date
periodCurrMonth=Current month
periodCustom=Custom

#YMSG: Movement type legend, mirrors the prototype's subtitle
movementLegend=101 Receipt \u00b7 102 Receipt reversal (posted negative) \u00b7 Z22 Rework \u00b7 STO doc types excluded at source \u00b7 quantities reported per base UoM, never summed across UoMs

# ------------------------------------------------------------------- KPIs ----
#XFLD: Delta reference period for the KPI cards
vsPriorPeriod=vs same period last year
#XFLD: Quality bucket share of gross receipt quantity. {0} = percentage
shareOfGross={0} of gross

#XFLD: Ratio strip notes
aboveTarget=above target
withinTarget=within target
cleanReceipts=clean receipts

#XFLD: Ratio strip always-visible formula notes. {0} = target percentage
rejRateNote=rejected \u00f7 inspected qty \u00b7 target {0}%
reworkRateNote=Z22 \u00f7 gross qty \u00b7 target {0}%
reversalRateNote=102 reversal \u00f7 gross qty
netRateNote=net qty \u00f7 gross qty

# ------------------------------------------------------------------ scope ----
#XFLD: Shown in the scope line when a filter is empty
allVendors=All vendors
allMaterials=All materials
allPlants=All plants
allDocTypes=All PO doc types (STO excluded)

# ----------------------------------------------------------------- charts ----
#XTIT
chartTrendTitle=Receipt flow over time
#XFLD
chartTrendSubQty=101 receipt vs 102 reversal (negative) \u00b7 Z22 rework \u00b7 net line
#XFLD
chartTrendSubValue=Receipt value vs reversal value (negative) \u00b7 Z22 rework \u00b7 net line
#XBUT: Quantity/value toggle on the trend chart
modeQty=GRN Qty
#XBUT
modeValue=GRN Value

#XTIT
chartQualityTitle=Quality disposition
#XFLD
chartQualitySub=Accepted \u00b7 Rejected \u00b7 Sample \u00b7 Under Inspection, with the rejection rate

#XTIT
chartVendorTitle=Top vendors by GRN value
#XFLD
chartVendorSub=Net receipt value with rejection rate on the secondary axis. Click a bar to filter.

#XTIT
chartPlantTitle=Quality composition - top 10 plants
#XFLD
chartPlantSub=Share of receipt quantity by disposition, per plant

#XTIT
chartMaterialTitle=Top 20 materials by GRN value
#XFLD
chartMaterialSub=Share of net receipt value \u00b7 labels lead out to both sides

#XTIT
chartDocTypeTitle=GRN value by PO document type
#XFLD
chartDocTypeSub=All doc types ranked high to low, darker = higher value \u00b7 drag the slider or scroll to move through the tail \u00b7 STO excluded
#XBUT: Re-fit the doc-type chart's zoom window
resetView=Reset view

#XTIT
chartMatRejTitle=Materials with highest rejection rate
#XFLD
chartMatRejSub=Rejected quantity and rate \u00b7 worst 10 materials

#XFLD: Badges
badgeTop10=TOP 10
badgeWorst10=WORST 10

# ------------------------------------------------------------- scorecard ----
#XTIT
scorecardTitle=Vendor scorecard
#XFLD
scorecardSub=Ranked by weighted quality score \u00b7 click a row to filter the dashboard to that vendor
#XFLD: Row count badge. {0} = number of rows. Chosen per the best/worst toggle.
scorecardCountBest=TOP {0}
scorecardCountWorst=LOWEST {0}
#XFLD: Vendor scorecard rank-direction toggle
rankBest=Best performers
rankWorst=Needs attention
#XFLD: Scorecard column headers
colVendor=Vendor
colGrnQty=GRN Qty
colNetQty=Net Qty
colGrnValue=GRN Value
colRejQty=Rej. Qty
colRejRate=Rej. rate
colRework=Rework
colScore=Score

