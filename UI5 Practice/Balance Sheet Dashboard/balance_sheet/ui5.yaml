# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.sap.balancesheet
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://vhafbmedap01.hec.erp.alimco.in
            client: '120'
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  # Chart.js is a pre-built third-party UMD bundle. Keep it out of UI5's
  # minifier (already minified, no source map) and out of the Component preload
  # analysis (its modern syntax e.g. new.target breaks the module analyzer).
  # The file is still copied into dist/ and loaded at runtime via libs/.
  minification:
    excludes:
      - "com/sap/balancesheet/libs/**"
  componentPreload:
    excludes:
      - "com/sap/balancesheet/libs/**"
