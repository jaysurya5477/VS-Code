# This is the resource bundle for com.sap.zsdpmsdash

#Texts for manifest.json

#XTIT: Application name
appTitle=Plant & Material Wise Sales Dashboard

#YDES: Application description
appDescription=Plant & Material Wise Sales Dashboard - Sales & Distribution billing analytics by plant, material, scheme and geography

# ---------------------------------------------------------------- header ----
#XTIT: Main view title
title=Plant & Material Wise Sales Dashboard
#XFLD: Module chip next to the title
headBadge=SD · Billing
#XFLD: Header subtitle
headSub=Material × Plant × Region · source ZSD_SALE_ALL · net, GST & gross by billing document
#XFLD: Label of the line that echoes the current selection
scopeLabel=SCOPE
#XFLD: Timestamp of the last successful load. {0} = local time
lastRefreshed=Refreshed {0}
#XBUT: Appearance switch
themeAuto=Auto
themeLight=Light
themeDark=Dark

# ---------------------------------------------------------------- filters ----
#XBUT: Run the query with the current filters
go=Go
#XBUT: Clear all filters back to their defaults
reset=Reset
#XFLD: Fiscal year filter
filterFy=Fiscal Year
#XFLD: Zone filter
filterZone=Zone
#XFLD: State filter
filterState=State
#XFLD: Plant filter
filterPlant=Plant
#XFLD: Scheme filter
filterScheme=Scheme
#XFLD: Material filter
filterMaterial=Material
#XFLD: FY-period (month) filter
filterPeriod=Period
#XFLD: Placeholder shown when a code filter is empty
filterAllPlaceholder=All
#YMSG: Explains how the code filters behave
filterHint=Zone, State, Plant, Scheme, Material and Period accept any number of values. Leave a filter empty to include everything. Changes apply when you click Go. The State/Plant/Scheme/Material lists are built from the codes the dashboard has returned so far, so they grow as you widen the selection.

# ------------------------------------------------------------------- KPIs ----
#XFLD: Delta reference period for the KPI cards
vsPriorYear=vs same period last year
#YMSG: Yesterday/Month-End Sale card context line. {0} = date, {1} = invoice count
kpiDailyNote=as of {0} · {1} invoices
#YMSG: Yesterday/Month-End Sale card when the reference date hasn't happened yet
kpiDailyNoteEmpty=no billing yet for this date

# ------------------------------------------------------------------ scope ----
#XFLD: Shown in the scope line when a filter is empty
allZones=All zones
allStates=All states
allPlants=All plants
allSchemes=All schemes
allMaterials=All materials

# ----------------------------------------------------------------- charts ----
#XTIT
chartTrendTitle=Sales trend
#XFLD
chartTrendSub=Net value by FY period (Apr–Mar)

#XTIT
mapTitle=Sales across India
#YMSG: {0} = fiscal year
mapSubtitle=State choropleth + Unit map dots · FY {0}
#XFLD: Choropleth granularity toggle
granularityState=State
granularityZone=Zone
#XFLD: Unit-dot overlay switch
dotsOn=Dots on
dotsOff=Dots off
#XFLD: Map colour scale caption
mapScaleLow=Lower net value
mapScaleHigh=Higher net value
#XFLD: Map dot legend
mapDotKey=Dot = Unit, sized by net value

#XTIT
chartSchemeTitle=Scheme performance
#XFLD
chartSchemeSub=Net value by government/institutional scheme

#XTIT
chartPlantTitle=Sales by plant
#XFLD
chartPlantSub=Net + tax, stacked, ranked by net value
#XFLD
badgeTop20=TOP 20

#XTIT
chartMaterialTitle=Sales by material
#XFLD
chartMaterialSub=Net material value, ranked

# ---------------------------------------------------- empty and error states ----
#YMSG: Generic empty state
noData=No data for the current selection
#YMSG
noDataTrend=No sales in the selected fiscal year
#YMSG
noDataScheme=No schemes for the current selection
#YMSG
noDataPlant=No plants for the current selection
#YMSG
noDataMaterial=No materials for the current selection

#YMSG: {0} = entity set name, {1} = message from the backend
errorLoadFailed=Could not load the dashboard ({0}): {1}
#YMSG: {0} = underlying error message
errorEchartsFailed=Could not initialise the charting library: {0}
#YMSG
errorNoODataModel=The OData model is not configured. Check the mainService data source in manifest.json.
