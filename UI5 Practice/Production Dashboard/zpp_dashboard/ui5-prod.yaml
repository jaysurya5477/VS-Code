# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
#
# Production test config. Points the app at the live SAP system so you can
# validate against real data WITHOUT touching the default dev ui5.yaml.
# Run with:  npm run start-prod
# Credentials are NOT stored here - the Fiori proxy will prompt for the
# username/password in the terminal on first request.

specVersion: "4.0"
metadata:
  name: com.sap.zppdashboard
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://erp.alimco.in
            client: '300'
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
