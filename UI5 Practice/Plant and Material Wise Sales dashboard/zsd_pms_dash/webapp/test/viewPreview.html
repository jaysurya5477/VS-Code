<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMS full view preview (stub model, no backend)</title>
<!--
	Loads the REAL zsd_pms_dash.view.xml with a stub "dash" JSONModel standing in for the
	OData-backed controller state, so what renders here is the actual shipped markup - not a
	hand-typed copy - without needing VPN access to the SAP backend. The controller's own
	_loadData() is short-circuited (no OData model on the component), so onGo/onReset are
	inert; everything else (filters, KPI cards, map, scheme list) is driven by the stub model
	set below.

	Open with:
	  node node_modules/@ui5/cli/bin/ui5.cjs serve --config=ui5.yaml
	  http://localhost:8099/test/viewPreview.html
-->
<script
	id="sap-ui-bootstrap"
	src="../resources/sap-ui-core.js"
	data-sap-ui-theme="sap_horizon"
	data-sap-ui-resourceroots='{"com.sap.zsdpmsdash": "../"}'
	data-sap-ui-async="true"
	data-sap-ui-compatVersion="edge"
	data-sap-ui-libs="sap.m"></script>
<link rel="stylesheet" href="../css/style.css">
<style>
	html, body { margin: 0; padding: 0; height: 100%; }
	body { background: var(--pms-bg); }
</style>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
<div id="host" style="height:100%"></div>
<script>
sap.ui.getCore().attachInit(function () {
	"use strict";

	var sTheme = /theme=dark/.test(location.search) ? "dark" : "light";

	sap.ui.require([
		"sap/ui/model/json/JSONModel",
		"sap/ui/model/resource/ResourceModel",
		"sap/ui/core/mvc/XMLView",
		"com/sap/zsdpmsdash/controller/zsd_pms_dash.controller",
		"com/sap/zsdpmsdash/model/appTheme"
	], function (JSONModel, ResourceModel, XMLView, ControllerClass, appTheme) {

		// onInit normally builds its own "dash" model, loads ECharts and calls _loadData()
		// against the component's OData model - none of which exists in this standalone
		// preview. Replaced with just the theming side effect; the stub model below is set
		// straight onto the view once it exists, and the interactive handlers are stubbed
		// out further down so a click during visual testing can't call into a _loadData()
		// that would throw for lack of an OData model.
		//
		// setMode(), not apply(): appTheme's "auto" mode follows the OS/browser's own
		// prefers-color-scheme, which headless Chromium reports as dark by default - calling
		// apply() alone would silently re-derive dark regardless of the ?theme= query param.
		// setMode() is exactly what the real header's Light/Dark toggle calls, so this pins
		// the theme the same way a user's click would.
		ControllerClass.prototype.onInit = function () {
			appTheme.setMode(sTheme);
		};

		var TREND = [41200000, 38800000, 50100000, 47000000, 52300000, 61000000,
			54500000, 58800000, 60100000, 64000000, 59000000, 71200000];

		var GEO = [
			{Regio: "27", StateText: "Maharashtra", AlmZone: "West", NetValue: "84210000", TaxValue: "15157800", GrossValue: "99367800", PriorGross: "90978000", PriorValue: "77100000", DeltaPct: "9.2", PlantCount: "12", InvoiceCount: "3211"},
			{Regio: "33", StateText: "Tamil Nadu", AlmZone: "south ", NetValue: "61050000", TaxValue: "10989000", GrossValue: "72039000", PriorGross: "75756000", PriorValue: "64200000", DeltaPct: "-4.9", PlantCount: "9", InvoiceCount: "2410"},
			{Regio: "24", StateText: "Gujarat", AlmZone: "WEST", NetValue: "45300000", TaxValue: "8154000", GrossValue: "53454000", PriorGross: "47318000", PriorValue: "40100000", DeltaPct: "13.0", PlantCount: "7", InvoiceCount: "1877"},
			{Regio: "09", StateText: "Uttar Pradesh", AlmZone: "Central", NetValue: "31200000", TaxValue: "5616000", GrossValue: "36816000", PriorGross: "36462000", PriorValue: "30900000", DeltaPct: "1.0", PlantCount: "5", InvoiceCount: "1402"},
			{Regio: "29", StateText: "Karnataka", AlmZone: "South", NetValue: "27800000", TaxValue: "5004000", GrossValue: "32804000", PriorGross: "0", PriorValue: "0", DeltaPct: null, PlantCount: "4", InvoiceCount: "1190"},
			{Regio: "19", StateText: "West Bengal", AlmZone: "East", NetValue: "14400000", TaxValue: "2592000", GrossValue: "16992000", PriorGross: "18644000", PriorValue: "15800000", DeltaPct: "-8.9", PlantCount: "3", InvoiceCount: "760"},
			{Regio: "23", StateText: "Madhya Pradesh", AlmZone: "Central", NetValue: "9800000", TaxValue: "1764000", GrossValue: "11564000", PriorGross: "9794000", PriorValue: "8300000", DeltaPct: "18.1", PlantCount: "2", InvoiceCount: "540"},
			{Regio: "18", StateText: "Assam", AlmZone: "North East", NetValue: "0", TaxValue: "0", GrossValue: "0", PriorGross: "1416000", PriorValue: "1200000", DeltaPct: "-100.0", PlantCount: "0", InvoiceCount: "0"}
		];
		// AlmZone now drives the map's zone grouping, so these mirror real ZSD_ZONE_PLANT
		// assignments rather than the hostile placeholders they used to be. Two deliberate
		// cases remain to exercise formatter.zoneKey(): Tamil Nadu's trailing space and
		// Gujarat's upper case must both fold onto the same zone as their neighbours.
		//
		// Uttar Pradesh is the case that matters most: it is Central here, not North, which
		// is ALIMCO's real assignment for 2000 HQ (Kanpur). It is what proves a business
		// zone can reach a state that sits nowhere near the other Central states - the very
		// thing the old preset zone polygons could not express. Assam covers the sixth zone
		// that used to be unreachable, indiaGeo having folded its polygon into East.

		// U01 (Mumbai) sits right on the west coast, so its leader line is short even though
		// its own latitude band is otherwise wide. U02 is deep inland (Madhya Pradesh, no
		// coast anywhere near its own band) and still gets a callout - routed to the nearer of
		// the map's open north/south margins instead (see control/IndiaMap.js
		// buildCallouts()'s own header). U03/U04/U05 sit in the narrow north/south bands
		// themselves, so their lines stay short.
		var DOTS = [
			{UnitCode: "U01", NetValue: "84210000", TaxValue: "15157800", GrossValue: "99367800", PriorGross: "90978000", PriorValue: "77100000", DeltaPct: "9.2", Latitude: "18.52", Longitude: "73.86", PlantCount: "12"},
			{UnitCode: "U02", NetValue: "31000000", TaxValue: "5580000", GrossValue: "36580000", PriorGross: "33040000", PriorValue: "28000000", DeltaPct: "10.7", Latitude: "22.0", Longitude: "79.0", PlantCount: "6"},
			{UnitCode: "U03", NetValue: "22000000", TaxValue: "3960000", GrossValue: "25960000", PriorGross: "22420000", PriorValue: "19000000", DeltaPct: "15.8", Latitude: "33.5", Longitude: "75.0", PlantCount: "3"},
			{UnitCode: "U04", NetValue: "18500000", TaxValue: "3330000", GrossValue: "21830000", PriorGross: "20060000", PriorValue: "17000000", DeltaPct: "8.8", Latitude: "8.5", Longitude: "77.5", PlantCount: "2"},
			{UnitCode: "U05", NetValue: "9800000", TaxValue: "1764000", GrossValue: "11564000", PriorGross: "10738000", PriorValue: "9100000", DeltaPct: "7.7", Latitude: "9.9", Longitude: "76.3", PlantCount: "2"}
		];

		// A production-shaped spread (14 plants, west/south heavy) for eyeballing the callout
		// gutters, which only really show their behaviour at that scale: ?dots=stress
		if (/dots=stress/.test(location.search)) {
			DOTS = [
				["2000", 272000000, 32.7, 74.8], ["4100", 60000000, 30.3, 76.0],
				["3100", 64000000, 28.6, 77.2], ["4700", 62000000, 26.8, 75.8],
				["3300", 155000000, 23.2, 72.6], ["4500", 111000000, 19.1, 72.9],
				["3500", 31000000, 21.1, 79.1], ["4300", 101000000, 12.9, 77.6],
				["3600", 101000000, 13.1, 80.3], ["3200", 26000000, 9.9, 76.3],
				["4800", 14000000, 8.5, 77.5], ["4600", 89000000, 26.2, 91.7],
				["4200", 30000000, 20.3, 85.8], ["3400", 16000000, 22.6, 88.4]
			].map(function (a, i) {
				// Deliberately mixed lengths - calloutLabel() has to trim the long ones to
				// the gutter without ever dropping the code or the value.
				var aNames = ["Jammu", "Ambala", "New Delhi", "Jaipur", "Ahmedabad",
					"Mumbai Andheri East", "Nagpur", "Bengaluru", "Chennai", "Kochi",
					"Kanyakumari", "Guwahati", "Bhubaneswar", "Kolkata"];
				// a[1] is net; tax at a flat 18% keeps the mock arithmetic self-consistent.
				// GrossValue is what the map sizes and labels the dot by, so a fixture row
				// without it renders no dot at all.
				var iNet = a[1];
				var iTax = Math.round(iNet * 0.18);
				return {UnitCode: a[0], UnitName: aNames[i], NetValue: String(iNet),
					TaxValue: String(iTax), GrossValue: String(iNet + iTax),
					PriorValue: "0", PriorGross: "0", DeltaPct: null,
					Latitude: String(a[2]), Longitude: String(a[3]), PlantCount: "3"};
			});
		}

		var SCHEMES = [
			{Category: "ADIP", CatDesc: "ADIP Sale", NetValue: "84000000", TaxValue: "15120000", GrossValue: "99120000", PriorGross: "91439000", SharePct: "31.4", InvoiceCount: "3120", DeltaPct: "8.4"},
			{Category: "ADIPSSA", CatDesc: "ADIP SSA", NetValue: "46000000", TaxValue: "8280000", GrossValue: "54280000", PriorGross: "56016000", SharePct: "17.2", InvoiceCount: "1980", DeltaPct: "-3.1"},
			{Category: "ATM", CatDesc: "AT-Mart", NetValue: "38000000", TaxValue: "6840000", GrossValue: "44840000", PriorGross: "0", SharePct: "14.2", InvoiceCount: "1544", DeltaPct: "100.0"},
			{Category: "NICRC", CatDesc: "N.I. CRC", NetValue: "0", TaxValue: "0", GrossValue: "0", PriorGross: "12000000", SharePct: "0.0", InvoiceCount: "0", DeltaPct: "-100.0"}
		];

		var options = function (aKeys) { return aKeys.map(function (k) { return {key: k, text: k}; }); };

		var oDash = new JSONModel({
			fy: "2026",
			options: {
				fy: [{key: "2026", text: "FY 2026-27"}, {key: "2025", text: "FY 2025-26"}],
				zone: options(["North", "West", "South", "East", "Central"]),
				state: GEO.map(function (r) { return {key: r.Regio, text: r.StateText, info: r.Regio}; }),
				plant: options(["1001", "1002", "1003"]),
				scheme: SCHEMES.map(function (s) { return {key: s.Category, text: s.CatDesc, info: s.Category}; }),
				material: options(["MAT-1", "MAT-2"]),
				period: options(["1", "2", "3"])
			},
			themeMode: sTheme,
			themeOptions: [{key: "auto", text: "Auto"}, {key: "light", text: "Light"}, {key: "dark", text: "Dark"}],
			granularityOptions: [{key: "state", text: "State"}, {key: "zone", text: "Zone"}],
			mapGranularity: /gran=zone/.test(location.search) ? "zone" : "state",
			mapShowDots: true,
			mapSubtitle: "9 of 36 states billed · click a state to filter",
			mapTexts: {
				scaleCap: "Gross value", lowest: "lowest", low: "low", high: "high",
				noBilling: "no billing", dotKey: "dot size = unit gross value",
				grossBilled: "Gross billed", netValue: "Net value", taxValue: "Tax (GST)",
				growth: "Growth", share: "Share of India",
				plantsBilling: "Plants billing", invoices: "Invoices",
				zoneStates: "states", unitPlants: "plants", newLabel: "new"
			},
			// ?deltas=off mirrors the controller's _deltasUnreliable( ) verdict: FY 2026
			// with a filter beyond Fiscal Year, where the prior year predates VKBUR and the
			// comparison cannot be trusted. Every growth pill should disappear.
			deltaVisible: !/deltas=off/.test(location.search),
			schemeSubtitle: "Gross value by scheme · vs FY 2025",
			priorFyLabel: "FY 2025",
			selectedRegios: ["27"],
			selectedZones: [],
			selectedSchemes: ["ADIPSSA"],
			scopeText: "FY 2026 · All zones · Maharashtra · All plants · All schemes · All materials",
			lastRefreshedText: "Refreshed just now",
			errorText: "",
			kpis: [
				{label: "Total net value", valueText: "₹6.58 Cr", deltaText: "+9.2%", deltaTone: "up", sub: "₹65,800,000", accent: "net", spark: TREND},
				{label: "Total tax (GST)", valueText: "₹1.18 Cr", deltaText: "+7.1%", deltaTone: "up", sub: "18.0% avg rate", accent: "tax", spark: TREND},
				{label: "Total gross value", valueText: "₹7.76 Cr", deltaText: "-2.4%", deltaTone: "down", sub: "₹77,600,000", accent: "gross", spark: TREND},
				// The daily card's headline is GROSS, so it carries sub2 - the net/tax breakdown
				// on a second, smaller line. The three totals cards each already ARE one of
				// those measures and leave sub2 empty.
				{label: "Yesterday Sale", valueText: "₹12.40 L", deltaText: "+0.0%", deltaTone: "flat", sub: "13 Aug 26 · 143 invoices", sub2: "net ₹10.51 L · tax ₹1.89 L", accent: "daily", spark: TREND}
			],
			geoRows: GEO,
			dotRows: DOTS,
			schemeRows: SCHEMES.filter(function (s) { return parseFloat(s.NetValue) > 0; }),
			charts: {
				plant: {title: {text: "plant chart placeholder (ECharts not loaded in this preview)", left: "center", top: "middle", textStyle: {fontSize: 12}}},
				material: {title: {text: "material chart placeholder (ECharts not loaded in this preview)", left: "center", top: "middle", textStyle: {fontSize: 12}}}
			}
		});

		var oI18n = new ResourceModel({bundleUrl: "../i18n/i18n.properties"});

		XMLView.create({
			viewName: "com.sap.zsdpmsdash.view.zsd_pms_dash"
		}).then(function (oView) {
			oView.setModel(oDash, "dash");
			oView.setModel(oI18n, "i18n");
			// Stub out every controller method that would otherwise touch a live OData
			// model or ECharts instance - this preview only needs the filter bar, KPI
			// cards, map and scheme list to render and be interactive.
			var oController = oView.getController();
			["onGo", "onReset", "onMapGranularityChange", "onMapDotsToggle", "onMapStatePress",
				"onMapZonePress", "onSchemePress", "onTopStatePress", "onThemeSelect"
			].forEach(function (sMethod) {
				oController[sMethod] = function () { /* inert in this preview */ };
			});
			oView.placeAt("host");

			// ?action=selectAllZone|zoneMode|tipMaharashtra drives a one-off interaction after
			// layout has settled, so the headless capture can photograph the result of an
			// actual click rather than a hand-typed equivalent state.
			setTimeout(function () {
				var m = /action=([^&]+)/.exec(location.search);
				if (m === null) {
					document.body.setAttribute("data-preview-ready", "1");
					return;
				}
				var sAction = decodeURIComponent(m[1]);
				if (sAction === "openZonePicker") {
					// Opens the Zone MultiComboBox's own picker popover, so the screenshot
					// shows the native showSelectAll checkbox row a real click would reveal.
					oView.byId("zoneFilter").open();
				} else if (sAction === "zoneMode") {
					oView.byId("indiaMap").setGranularity("zone");
					oView.byId("indiaMap").setSelectedZones(["West"]);
				} else if (sAction.indexOf("tip") === 0) {
					var sState = sAction.slice(3);
					var oNode = oView.byId("indiaMap").getDomRef()
						.querySelector('[data-pms-state="' + sState + '"]');
					if (oNode) {
						oNode.dispatchEvent(new MouseEvent("mouseover",
							{bubbles: true, clientX: 500, clientY: 500}));
					} else {
						document.title = "TIP TARGET NOT FOUND: " + sState;
					}
				}
				setTimeout(function () { document.body.setAttribute("data-preview-ready", "1"); }, 300);
			}, 800);
		}).catch(function (e) {
			document.title = "VIEW LOAD FAILED: " + e.message;
			document.getElementById("host").textContent = String(e.stack || e);
		});
	});
});
</script>
</body>
</html>
